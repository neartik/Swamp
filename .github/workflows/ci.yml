name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Write a .snap.new beside any snapshot that no longer matches, so it can be uploaded.
  INSTA_UPDATE: new
  # The e2e harness uses a throwaway HOME, so git needs an identity here.
  GIT_AUTHOR_NAME: swamp ci
  GIT_AUTHOR_EMAIL: ci@swamp.invalid
  GIT_COMMITTER_NAME: swamp ci
  GIT_COMMITTER_EMAIL: ci@swamp.invalid

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml: the pinned channel with rustfmt and clippy.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Upload pending insta snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: insta-snapshots-${{ matrix.os }}
          path: "**/*.snap.new"
          if-no-files-found: ignore
